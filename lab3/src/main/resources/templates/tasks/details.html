<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>
<div class="container mt-4">
    <h2>Task Details</h2>

    <table class="table table-bordered">
        <tr>
            <th>ID</th>
            <td th:text="${task.id}"></td>
        </tr>
        <tr>
            <th>Name</th>
            <td th:text="${task.name}"></td>
        </tr>
        <tr>
            <th>Description</th>
            <td th:text="${task.description}"></td>
        </tr>
        <tr>
            <th>Deadline</th>
            <td th:text="${task.deadlineDate}"></td>
        </tr>
        <tr>
            <th>Completed</th>
            <td th:text="${task.completed} ? 'Yes' : 'No'"></td>
        </tr>
    </table>

    <div class="mt-3">
        <a href="/tasks" class="btn btn-secondary">Back to List</a>
        <a th:href="@{'/tasks/edit/' + ${task.id}}" class="btn btn-secondary">Edit</a>
        <a th:href="@{'/tasks/delete/' + ${task.id}}" class="btn btn-secondary"
           onclick="return confirm('Confirm that u want delete this task')">Delete</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
