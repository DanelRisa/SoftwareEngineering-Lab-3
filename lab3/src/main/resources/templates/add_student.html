<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>
<div class="container  mt-4">
    <div class="d-flex justify-content-between align-items-center my-3">
    <h1 class="my-0">Add Student</h1>

    <a href="/" class="btn btn-primary">Home</a>
    </div>
    <form th:action="@{/add_student}" th:object="${student}" method="post" class="mt-3">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Surname</label>
            <input type="text" th:field="*{surname}" class="form-control"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Exam Result</label>
            <input type="number" th:field="*{exam}" class="form-control"/>
        </div>
        <button type="submit" class="btn btn-secondary">Save</button>
    </form>
</div>
</body>
</html>
