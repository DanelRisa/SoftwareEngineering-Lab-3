<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center my-3">
        <h1 class="m-0">Student Exam Results</h1>
        <div>
            <a href="/" class="btn btn-primary">Home</a>
            <a href="/add_student" class="btn btn-success">Add Student</a>
            <a href="/tasks" class="btn btn-info">Task Manager</a>
        </div>
    </div>


    <table class="table table-bordered table-striped mt-3">
        <thead class="table">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Surname</th>
            <th>Exam</th>
            <th>Mark</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}"
            th:classappend="${student.mark == 'F'} ? 'table-danger text-danger' : ''">
            <td th:text="${student.id}"></td>
            <td th:text="${student.name}"></td>
            <td th:text="${student.surname}"></td>
            <td th:text="${student.exam}"></td>
            <td th:text="${student.mark}"></td>
            <td>
                <a th:href="@{'/delete/' + ${student.id}}" class="btn btn-btn-secondary btn-sm">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
